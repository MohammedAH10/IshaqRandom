<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AfriLearn AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════
       THEME TOKENS
    ═══════════════════════════════════════ */
    [data-theme="dark"] {
      --bg:      #07111f;
      --surf:    #0d1e32;
      --panel:   #112540;
      --panel2:  #162c4a;
      --bord:    #1e3652;
      --bord2:   #254870;
      --accent:  #3b82f6;
      --accent2: #60a5fa;
      --grn:     #22c55e;
      --red:     #ef4444;
      --txt:     #e8f0fb;
      --txt2:    #8aacce;
      --txt3:    #456080;
      --ubub:    #162c4a;
      --aibub:   #0d1e32;
      --inbg:    #0d1e32;
      --inbrd:   #1e3652;
      --code:    #0a1828;
      --scr:     #254870;
      --shadow:  0 4px 24px rgba(0,0,0,.45);
    }
    [data-theme="light"] {
      --bg:      #f4f6fb;
      --surf:    #ffffff;
      --panel:   #f0f3f9;
      --panel2:  #e5ecf8;
      --bord:    #d2dcea;
      --bord2:   #b8ccdf;
      --accent:  #2563eb;
      --accent2: #3b82f6;
      --grn:     #16a34a;
      --red:     #dc2626;
      --txt:     #0f1f38;
      --txt2:    #3d5a80;
      --txt3:    #7a95b8;
      --ubub:    #dce8ff;
      --aibub:   #ffffff;
      --inbg:    #ffffff;
      --inbrd:   #d2dcea;
      --code:    #eef2f9;
      --scr:     #b8ccdf;
      --shadow:  0 4px 16px rgba(0,0,0,.08);
    }

    /* ═══════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--txt);
      transition: background .25s, color .25s;
      display: flex;
      flex-direction: column;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scr); border-radius: 3px; }

    /* ═══════════════════════════════════════
       AUTH OVERLAY
    ═══════════════════════════════════════ */
    #auth-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(ellipse at 25% 35%, rgba(59,130,246,.07) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 70%, rgba(96,165,250,.04) 0%, transparent 50%);
    }
    .auth-card {
      background: var(--surf);
      border: 1px solid var(--bord2);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%; max-width: 420px;
      box-shadow: var(--shadow);
      animation: authPop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes authPop {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }
    .auth-logo {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 6px;
    }
    .auth-logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 18px rgba(59,130,246,.35);
    }
    .auth-logo-name {
      font-size: 24px; font-weight: 800;
      letter-spacing: -.5px; color: var(--txt);
    }
    .auth-logo-name span { color: var(--accent2); }
    .auth-tag {
      text-align: center; font-size: 10px; color: var(--accent2);
      font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .auth-sub {
      text-align: center; font-size: 12px; color: var(--txt2);
      margin-bottom: 24px; line-height: 1.6;
    }
    .auth-tabs {
      display: flex; background: var(--panel);
      border-radius: 10px; padding: 4px; margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1; padding: 9px; border-radius: 8px; border: none;
      background: transparent; color: var(--txt2);
      font-family: inherit; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .auth-tab.active { background: var(--panel2); color: var(--txt); }
    .auth-err {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      color: var(--red); font-size: 13px; padding: 10px 14px;
      border-radius: 8px; margin-bottom: 14px; display: none;
    }
    .auth-field { margin-bottom: 15px; }
    .auth-label {
      display: block; font-size: 11px; font-weight: 700; color: var(--txt2);
      text-transform: uppercase; letter-spacing: .7px; margin-bottom: 6px;
    }
    .auth-input {
      width: 100%; background: var(--panel); border: 1.5px solid var(--bord);
      color: var(--txt); font-family: inherit; font-size: 14px;
      padding: 12px 14px; border-radius: 10px; outline: none;
      transition: border-color .2s; -webkit-appearance: none;
    }
    .auth-input:focus { border-color: var(--accent); }
    .auth-input::placeholder { color: var(--txt3); }
    .auth-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      border: none; border-radius: 10px; color: #fff;
      font-family: inherit; font-weight: 800; font-size: 15px;
      cursor: pointer; margin-top: 6px; transition: all .2s;
      box-shadow: 0 4px 16px rgba(59,130,246,.35);
    }
    .auth-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,.45); }
    .auth-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .auth-divider {
      text-align: center; color: var(--txt3); font-size: 12px;
      margin: 16px 0; position: relative;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; position: absolute; top: 50%; width: 42%; height: 1px;
      background: var(--bord);
    }
    .auth-divider::before { left: 0; }
    .auth-divider::after  { right: 0; }
    .auth-divider span { background: var(--surf); padding: 0 10px; position: relative; z-index: 1; }
    .auth-guest {
      width: 100%; padding: 12px; background: var(--panel);
      border: 1.5px solid var(--bord); border-radius: 10px;
      color: var(--txt2); font-family: inherit; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .auth-guest:hover { border-color: var(--accent); color: var(--txt); }
    .auth-theme-row {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 18px;
    }
    .auth-theme-btn {
      background: var(--panel); border: 1px solid var(--bord);
      border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; color: var(--txt2); transition: all .2s;
    }
    .auth-theme-btn:hover { border-color: var(--accent); }

    /* ═══════════════════════════════════════
       MAIN APP
    ═══════════════════════════════════════ */
    #app { display: none; flex-direction: column; height: 100vh; }

    /* HEADER */
    header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: var(--surf);
      border-bottom: 1px solid var(--bord);
      position: relative; z-index: 10;
    }
    .hdr-left { display: flex; align-items: center; gap: 10px; }
    .hdr-logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hdr-title { font-size: 15px; font-weight: 800; letter-spacing: -.4px; color: var(--txt); }
    .hdr-title span { color: var(--accent2); }
    .hdr-sub { font-size: 10px; color: var(--txt3); font-weight: 600; letter-spacing: .6px; text-transform: uppercase; }
    .hdr-right { display: flex; align-items: center; gap: 7px; }
    .hdr-user-chip {
      display: flex; align-items: center; gap: 7px;
      background: var(--panel); border: 1px solid var(--bord);
      border-radius: 20px; padding: 4px 12px 4px 5px;
    }
    .hdr-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .hdr-uname { font-size: 12px; font-weight: 700; color: var(--txt); }
    .hdr-btn {
      background: transparent; border: 1px solid var(--bord);
      color: var(--txt2); padding: 6px 12px; border-radius: 8px;
      font-family: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .hdr-btn:hover { border-color: var(--bord2); color: var(--txt); background: var(--panel); }
    .hdr-ic-btn {
      background: transparent; border: 1px solid var(--bord);
      color: var(--txt2); width: 34px; height: 34px; border-radius: 8px;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .hdr-ic-btn:hover { border-color: var(--bord2); color: var(--txt); background: var(--panel); }

    /* MESSAGES */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 24px 20%;
      display: flex; flex-direction: column; gap: 18px;
    }
    @media(max-width:1100px){ #messages { padding: 20px 8%; } }
    @media(max-width:700px)  { #messages { padding: 16px 4%; } }

    /* Welcome */
    #welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 22px; padding: 30px 16px;
    }
    .w-orb { position: relative; width: 88px; height: 88px; margin: 0 auto; }
    .w-icon-wrap {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: floatIcon 4s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%,100% { transform: translate(-50%,-50%) translateY(0); }
      50%      { transform: translate(-50%,-50%) translateY(-8px); }
    }
    .w-ring1 {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px dashed rgba(59,130,246,.22);
      animation: spin 14s linear infinite;
    }
    .w-ring2 {
      position: absolute; inset: -16px; border-radius: 50%;
      border: 1px dashed rgba(96,165,250,.13);
      animation: spin 22s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #welcome h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; color: var(--txt); }
    #welcome h1 span { color: var(--accent2); }
    .w-desc { font-size: 13.5px; color: var(--txt2); max-width: 400px; line-height: 1.65; }
    .w-starters {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; width: 100%; max-width: 540px;
    }
    @media(max-width:500px){ .w-starters { grid-template-columns: 1fr; } }
    .starter-card {
      background: var(--surf); border: 1px solid var(--bord);
      border-radius: 12px; padding: 13px 15px;
      text-align: left; cursor: pointer; transition: all .25s;
    }
    .starter-card:hover {
      border-color: var(--accent); transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .starter-q   { font-size: 12.5px; color: var(--txt); font-weight: 600; line-height: 1.4; }
    .starter-tag { font-size: 10px; color: var(--txt3); margin-top: 3px; text-transform: uppercase; letter-spacing: .3px; }

    /* Message bubbles */
    .msg-row { display: flex; gap: 10px; animation: msgIn .28s ease-out; }
    .msg-row.user-row { flex-direction: row-reverse; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-avatar.ai   { background: linear-gradient(135deg, var(--accent), #1d4ed8); }
    .msg-avatar.user { background: linear-gradient(135deg, #7c3aed, #4c1d95); }
    .bubble {
      max-width: 74%; border-radius: 16px;
      padding: 12px 16px; font-size: 14px;
      line-height: 1.7; word-break: break-word;
      border: 1px solid var(--bord);
    }
    .bubble.user-bubble { background: var(--ubub); border-bottom-right-radius: 4px; }
    .bubble.ai-bubble   { background: var(--aibub); border-bottom-left-radius: 4px; }
    .bubble-meta {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 7px; flex-wrap: wrap;
    }
    .bubble-name  { font-size: 10.5px; font-weight: 800; color: var(--accent2); text-transform: uppercase; letter-spacing: .5px; }
    .bubble-time  { font-size: 10px; color: var(--txt3); }

    /* AI content */
    .ai-content p  { margin: 0 0 8px; line-height: 1.7; }
    .ai-content p:last-child { margin-bottom: 0; }
    .ai-content ul, .ai-content ol { padding-left: 20px; margin: 7px 0; }
    .ai-content li { margin-bottom: 4px; line-height: 1.65; }
    .ai-content strong { font-weight: 700; color: var(--accent2); }
    .ai-content em     { font-style: italic; color: var(--txt2); }
    .ai-content pre {
      background: var(--code); border: 1px solid var(--bord);
      border-radius: 8px; padding: 12px 14px;
      overflow-x: auto; font-family: 'Fira Code', monospace;
      font-size: 12px; margin: 10px 0; line-height: 1.6;
      color: #a8d8ff; white-space: pre-wrap;
    }
    .ai-content code {
      font-family: 'Fira Code', monospace; font-size: 12.5px;
      background: var(--code); padding: 1px 5px; border-radius: 4px;
    }
    .ai-content pre code { background: none; padding: 0; }
    .ai-content h4 { color: var(--accent2); font-weight: 700; font-size: 14px; margin: 10px 0 5px; }
    .ai-content table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 8px 0; }
    .ai-content th, .ai-content td { border: 1px solid var(--bord); padding: 5px 10px; text-align: left; }
    .ai-content th { background: rgba(59,130,246,.1); color: var(--accent2); font-weight: 700; }

    .bubble-actions { display: flex; gap: 4px; margin-top: 9px; }
    .bact {
      background: transparent; border: 1px solid var(--bord); color: var(--txt3);
      padding: 2px 8px; border-radius: 6px; font-size: 11px;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .bact:hover { border-color: var(--bord2); color: var(--txt); background: var(--panel); }

    /* Typing indicator */
    .typing-row { display: flex; gap: 10px; }
    .typing-bubble {
      display: flex; align-items: center; gap: 5px;
      padding: 13px 16px; background: var(--aibub);
      border: 1px solid var(--bord); border-radius: 16px; border-bottom-left-radius: 4px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s;  }
    @keyframes dotBounce {
      0%,60%,100% { transform: translateY(0); opacity: .4; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }

    /* FOOTER / INPUT */
    footer {
      flex-shrink: 0;
      padding: 12px 20% 18px;
      background: var(--bg);
      border-top: 1px solid var(--bord);
    }
    @media(max-width:1100px){ footer { padding: 12px 8% 16px; } }
    @media(max-width:700px)  { footer { padding: 10px 4% 14px; } }
    .inp-wrap {
      display: flex; gap: 8px; align-items: flex-end;
      background: var(--inbg); border: 1.5px solid var(--inbrd);
      border-radius: 16px; padding: 11px 11px 11px 16px;
      transition: border-color .25s, box-shadow .25s;
    }
    .inp-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,.1);
    }
    #input-box {
      flex: 1; background: transparent; border: none;
      color: var(--txt); font-family: inherit; font-size: 14.5px;
      resize: none; min-height: 22px; max-height: 160px;
      outline: none; line-height: 1.5; overflow: hidden;
    }
    #input-box::placeholder { color: var(--txt3); }
    #input-box:disabled { opacity: .6; }
    #send-btn {
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      border: none; width: 38px; height: 38px; border-radius: 11px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .2s;
      box-shadow: 0 2px 8px rgba(59,130,246,.3);
    }
    #send-btn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(59,130,246,.4); }
    #send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .inp-footer {
      display: flex; justify-content: space-between;
      margin-top: 7px; padding: 0 2px;
    }
    .inp-hint { font-size: 11px; color: var(--txt3); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 22px; right: 22px; z-index: 9999;
      padding: 11px 18px; border-radius: 10px; font-size: 13px;
      font-weight: 600; display: none; animation: toastIn .25s ease-out;
      max-width: calc(100vw - 44px);
      background: rgba(34,197,94,.13); border: 1px solid rgba(34,197,94,.4); color: var(--grn);
    }
    @keyframes toastIn { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }

    @media(max-width:700px) {
      .bubble { max-width: 88%; }
      .w-starters { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<!-- AUTH OVERLAY -->
<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="auth-logo-name">AfriLearn<span>AI</span></div>
      </div>
    </div>
    <div class="auth-tag">waec . neco . jamb/utme . CAPS . KSCE. BECE</div>
    <p class="auth-sub">Sign in to your account or continue as a guest to start chatting.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login"    onclick="authSwitchTab('login')">Log In</button>
      <button class="auth-tab"        id="tab-register" onclick="authSwitchTab('register')">Register</button>
    </div>

    <div class="auth-err" id="auth-err"></div>

    <div class="auth-field" id="name-field" style="display:none">
      <label class="auth-label">Full Name</label>
      <input class="auth-input" id="inp-name" type="text" placeholder="Your name" autocomplete="name" />
    </div>

    <div class="auth-field">
      <label class="auth-label">Email Address</label>
      <input class="auth-input" id="inp-email" type="email" placeholder="your@email.com" autocomplete="email" />
    </div>

    <div class="auth-field">
      <label class="auth-label">Password</label>
      <input class="auth-input" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="auth-btn" id="auth-submit-btn" onclick="authSubmit()">Log In</button>

    <div class="auth-divider"><span>or</span></div>
    <button class="auth-guest" onclick="authGuest()">Continue as Guest</button>

    <div class="auth-theme-row">
      <button class="auth-theme-btn" id="auth-theme-btn" onclick="toggleTheme()">
        <span id="auth-theme-icon">&#9790;</span>
      </button>
      <span style="font-size:11px;color:var(--txt3)">Toggle theme</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- MAIN APP -->
<div id="app">

  <header>
    <div class="hdr-left">
      <div class="hdr-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="hdr-title">Gemini<span>Chat</span></div>
        <div class="hdr-sub">gemini-2.0-flash</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="hdr-user-chip">
        <div class="hdr-avatar" id="hdr-avatar">G</div>
        <span class="hdr-uname" id="hdr-uname">Guest</span>
      </div>
      <button class="hdr-ic-btn" id="app-theme-btn" onclick="toggleTheme()" title="Toggle theme">
        <span id="app-theme-icon">&#9790;</span>
      </button>
      <button class="hdr-btn" id="clear-btn">Clear</button>
    </div>
  </header>

  <main id="messages">
    <div id="welcome">
      <div class="w-orb">
        <div class="w-icon-wrap">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                  stroke="var(--accent2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="w-ring1"></div>
        <div class="w-ring2"></div>
      </div>
      <div>
        <h1>Hello, <span id="welcome-name">there</span></h1>
        <p class="w-desc" style="margin-top:10px">
          African Curriculum Tutor.
        </p>
      </div>
      <div class="w-starters" id="starters-grid"></div>
    </div>
  </main>

  <footer>
    <div class="inp-wrap">
      <textarea
        id="input-box"
        rows="1"
        placeholder="Ask anything... (Shift+Enter for new line)"
      ></textarea>
      <button id="send-btn" title="Send (Enter)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"
                stroke="#fff" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="inp-footer">
      <span class="inp-hint">Gemini Chat</span>
      <span class="inp-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</span>
    </div>
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// THEME
// ═══════════════════════════════════════════════════════════════
let currentTheme = (function() {
  try { return localStorage.getItem('gc_theme') || 'dark'; } catch { return 'dark'; }
})();

function applyTheme(t) {
  currentTheme = t;
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('gc_theme', t); } catch {}
  const isDark = t === 'dark';
  // Moon = dark mode icon (click to go light), Sun = light mode icon (click to go dark)
  const icon = isDark ? '&#9790;' : '&#9728;';
  document.getElementById('auth-theme-icon').innerHTML = icon;
  const appIcon = document.getElementById('app-theme-icon');
  if (appIcon) appIcon.innerHTML = icon;
}

function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }
applyTheme(currentTheme);

// ═══════════════════════════════════════════════════════════════
// AUTH — display only, guest is the real entry point
// ═══════════════════════════════════════════════════════════════
let currentUser = null;
let authMode = 'login';

function authSwitchTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('name-field').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Log In' : 'Create Account';
  document.getElementById('auth-err').style.display = 'none';
}

function authSubmit() {
  // Show a friendly message directing users to guest login
  const err = document.getElementById('auth-err');
  err.textContent = 'Authentication is not enabled. Please use "Continue as Guest" below.';
  err.style.display = 'block';
}

function authGuest() {
  bootApp({ name: 'Guest', avatar: 'G' });
}

function bootApp(u) {
  currentUser = u;
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('hdr-avatar').textContent = u.avatar || u.name[0].toUpperCase();
  document.getElementById('hdr-uname').textContent  = u.name;
  const wn = document.getElementById('welcome-name');
  if (wn) wn.textContent = u.name;
  setTimeout(() => { document.getElementById('input-box').focus(); }, 100);
}

window.addEventListener('DOMContentLoaded', () => {
  buildStarters();
  ['inp-email','inp-pass','inp-name'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') authSubmit(); });
  });
});

// ═══════════════════════════════════════════════════════════════
// STARTER CARDS
// ═══════════════════════════════════════════════════════════════
const STARTERS = [
  { q: 'Explain how transformers work in machine learning.', tag: 'AI / ML' },
  { q: 'Write a Python function to flatten a nested list.', tag: 'Code' },
  { q: 'What are the key differences between REST and GraphQL?', tag: 'Web Dev' },
  { q: 'Summarize the main ideas behind RAG systems.', tag: 'LLMs' },
];

function buildStarters() {
  const grid = document.getElementById('starters-grid');
  STARTERS.forEach(s => {
    const d = document.createElement('div');
    d.className = 'starter-card';
    d.innerHTML = `<div class="starter-q">${s.q}</div><div class="starter-tag">${s.tag}</div>`;
    d.onclick = () => sendWithText(s.q);
    grid.appendChild(d);
  });
}

// ═══════════════════════════════════════════════════════════════
// CHAT LOGIC
// ═══════════════════════════════════════════════════════════════
const messagesEl = document.getElementById('messages');
const inputBox   = document.getElementById('input-box');
const sendBtn    = document.getElementById('send-btn');
const clearBtn   = document.getElementById('clear-btn');
const welcome    = document.getElementById('welcome');

let history   = [];
let isLoading = false;

function nowTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
});

inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener('click', send);
clearBtn.addEventListener('click', clearChat);

function clearChat() {
  history = [];
  messagesEl.querySelectorAll('.msg-row, .typing-row').forEach(e => e.remove());
  welcome.style.display = 'flex';
}

function scrollToBottom() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

function hideWelcome() {
  if (welcome.style.display !== 'none') welcome.style.display = 'none';
}

function appendMessage(role, text) {
  hideWelcome();
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user-row' : '');

  const av = document.createElement('div');
  av.className = 'msg-avatar ' + (role === 'user' ? 'user' : 'ai');
  av.textContent = role === 'user' ? (currentUser?.avatar || 'U') : 'G';
  row.appendChild(av);

  const bub = document.createElement('div');
  bub.className = 'bubble ' + (role === 'user' ? 'user-bubble' : 'ai-bubble');

  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  const nameSpan = document.createElement('span');
  nameSpan.className = 'bubble-name';
  nameSpan.textContent = role === 'user' ? (currentUser?.name || 'You') : 'Gemini';
  const ts = document.createElement('span');
  ts.className = 'bubble-time';
  ts.textContent = nowTime();
  meta.appendChild(nameSpan);
  meta.appendChild(ts);
  bub.appendChild(meta);

  const con = document.createElement('div');
  if (role === 'user') {
    const p = document.createElement('p');
    p.textContent = text;
    con.appendChild(p);
  } else {
    con.className = 'ai-content';
    con.innerHTML = renderMarkdown(text);
  }
  bub.appendChild(con);

  if (role !== 'user') {
    const acts = document.createElement('div');
    acts.className = 'bubble-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'bact';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = () => {
      navigator.clipboard?.writeText(text).then(() => {
        copyBtn.textContent = 'Copied';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
      });
    };
    acts.appendChild(copyBtn);
    bub.appendChild(acts);
  }

  row.appendChild(bub);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bub;
}

function appendTypingIndicator() {
  hideWelcome();
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'msg-avatar ai';
  av.textContent = 'G';
  row.appendChild(av);
  const bub = document.createElement('div');
  bub.className = 'typing-bubble';
  bub.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  row.appendChild(bub);
  messagesEl.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function setLoading(val) {
  isLoading = val;
  sendBtn.disabled  = val;
  inputBox.disabled = val;
}

async function sendWithText(text) {
  if (!text || isLoading) return;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  setLoading(true);
  appendMessage('user', text);
  appendTypingIndicator();
  await doFetch(text);
  setLoading(false);
  inputBox.focus();
}

async function send() {
  const message = inputBox.value.trim();
  if (!message || isLoading) return;
  inputBox.value = '';
  inputBox.style.height = 'auto';
  setLoading(true);
  appendMessage('user', message);
  appendTypingIndicator();
  await doFetch(message);
  setLoading(false);
  inputBox.focus();
}

async function doFetch(message) {
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history }),
    });
    const data = await res.json();
    removeTypingIndicator();
    if (!res.ok || data.error) {
      appendMessage('model', data.error || 'Something went wrong. Please try again.');
    } else {
      appendMessage('model', data.reply);
      history.push({ role: 'user',  text: message });
      history.push({ role: 'model', text: data.reply });
    }
  } catch (err) {
    removeTypingIndicator();
    appendMessage('model', 'Network error. Make sure the server is running and try again.');
  }
}

// ═══════════════════════════════════════════════════════════════
// MARKDOWN RENDERER
// ═══════════════════════════════════════════════════════════════
function renderMarkdown(text) {
  let html = text
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;');

  html = html.replace(/```[\w]*\n?([\s\S]*?)```/g,
    (_, code) => `<pre><code>${code.trimEnd()}</code></pre>`);

  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  html = html.replace(/^###?\s+(.+)$/gm,
    '<h4 style="color:var(--accent2);font-weight:700;font-size:14px;margin:10px 0 5px">$1</h4>');

  html = html.replace(/^\|(.+)\|$/gm, row => {
    if (/^\|[\s:\-|]+\|$/.test(row)) return '';
    const cells = row.split('|').slice(1,-1).map(c => c.trim());
    return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
  });
  html = html.replace(/(<tr>[\s\S]+?<\/tr>)/g, '<table>$1</table>');

  html = html.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^\d+\. (.+)$/gm,   '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');

  html = html.split(/\n{2,}/).map(block => {
    if (/^<(pre|ul|ol|table|h4|div)/.test(block.trim())) return block;
    if (!block.trim()) return '';
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  return html;
}
</script>
</body>
</html>
